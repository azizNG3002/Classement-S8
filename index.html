<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ligue Pro Saison 8 — Classement</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000000;
    display: flex;
    justify-content: center;
    padding: 20px 8px;
    font-family: 'Oswald', sans-serif;
  }

  .poster {
    position: relative;
    width: 100%;
    max-width: 640px;
    background:
      radial-gradient(circle at 50% 0%, rgba(40,140,255,0.22) 0%, rgba(40,140,255,0) 45%),
      linear-gradient(180deg, #04070d 0%, #05090f 55%, #000000 100%);
    border: 2px solid rgba(40,140,255,0.4);
    border-radius: 8px;
    overflow: hidden;
    padding: 28px 18px 26px;
  }

  .top-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    border: 1px solid rgba(90,170,255,0.5);
    color: #5aaaff;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(90,170,255,0.08);
  }

  .title-block {
    text-align: center;
    margin-top: 16px;
  }

  .kicker {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 6px;
    font-size: 13px;
    color: #2f8fff;
    margin-bottom: 6px;
  }

  .league-name {
    font-family: 'Anton', sans-serif;
    font-size: 42px;
    line-height: 1;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #ffffff 0%, #bcdfff 55%, #2f8fff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(47,143,255,0.4);
  }

  .phase-pill {
    display: inline-block;
    margin-top: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: #000000;
    background: linear-gradient(90deg, #2f8fff, #7fc4ff);
    padding: 6px 22px;
    border-radius: 3px;
  }

  .table-wrap {
    margin-top: 26px;
    position: relative;
    z-index: 2;
    border: 1px solid rgba(90,170,255,0.25);
    border-radius: 6px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: #000000;
    background: linear-gradient(90deg, #2f8fff, #7fc4ff);
    text-transform: uppercase;
    padding: 10px 4px;
    text-align: center;
  }
  thead th:nth-child(2) { text-align: left; padding-left: 12px; }

  tbody td {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    color: #eaf4ff;
    text-align: center;
    padding: 9px 4px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  tbody td:nth-child(2) {
    text-align: left;
    padding-left: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  tbody tr:nth-child(odd) { background: rgba(255,255,255,0.02); }

  .rank {
    font-family: 'Anton', sans-serif;
    font-size: 15px;
    color: #5aaaff;
  }

  tbody tr:nth-child(1) .rank { color: #ffffff; }
  tbody tr:nth-child(1) { border-left: 3px solid #2f8fff; }

  .pts { font-weight: 500; color: #ffffff; }

  .legend {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: #7fa0c4;
    text-transform: uppercase;
  }
  .legend b { color: #5aaaff; font-weight: 500; }

  .footer-note {
    margin-top: 18px;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #5c7690;
    text-transform: uppercase;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 14px;
  }

  @media (min-width: 700px) {
    .league-name { font-size: 60px; }
    tbody td, thead th { font-size: 15px; padding: 11px 6px; }
  }
</style>
</head>
<body>

  <div class="poster">
    <div class="top-row">
      <div class="badge">14 joueurs</div>
      <div class="badge">13 journées</div>
    </div>

    <div class="title-block">
      <div class="kicker">EFOOTBALL — LIGUE ENTRE AMIS</div>
      <div class="league-name">CLASSEMENT</div>
      <div class="phase-pill">PHASE ALLER — SAISON 8</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Joueur</th>
            <th>MJ</th>
            <th>V</th>
            <th>N</th>
            <th>D</th>
            <th>DB</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="legend">
      <span><b>MJ</b> matchs joués</span>
      <span><b>V</b> victoires</span>
      <span><b>N</b> nuls</span>
      <span><b>D</b> défaites</span>
      <span><b>DB</b> diff. buts</span>
      <span><b>Pts</b> points</span>
    </div>

    <div class="footer-note">Ligue Pro Saison 8 · Phase Aller</div>
  </div>

<script>
// stats: [nom, MJ, V, N, D, GF, GA]
const raw = [
  ["Mahdi",1,1,0,0,5,0],
  ["Omar",1,1,0,0,6,2],
  ["Fehmi",1,1,0,0,3,0],
  ["Ala",1,0,1,0,2,2],
  ["Amen",1,0,1,0,2,2],
  ["Firas",1,0,1,0,2,2],
  ["Aziz",1,0,1,0,2,2],
  ["Moataz",1,0,1,0,1,1],
  ["Louay",1,0,1,0,1,1],
  ["Nouigues",1,0,1,0,1,1],
  ["Marwen",1,0,1,0,1,1],
  ["Wael",1,0,0,1,0,3],
  ["Mounir",1,0,0,1,2,6],
  ["Salah",1,0,0,1,0,5],
];

const players = raw.map(([nom, mj, v, n, d, gf, ga]) => ({
  nom, mj, v, n, d, gf, ga, db: gf - ga, pts: v * 3 + n
}));

players.sort((a, b) => b.pts - a.pts || b.db - a.db || b.gf - a.gf);

const tbody = document.getElementById('tbody');
players.forEach((p, i) => {
  const tr = document.createElement('tr');
  const dbTxt = p.db > 0 ? `+${p.db}` : `${p.db}`;
  tr.innerHTML = `<td class="rank">${i+1}</td><td>${p.nom}</td><td>${p.mj}</td><td>${p.v}</td><td>${p.n}</td><td>${p.d}</td><td>${dbTxt}</td><td class="pts">${p.pts}</td>`;
  tbody.appendChild(tr);
});
</script>

</body>
</html>
